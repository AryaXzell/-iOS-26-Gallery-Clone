name: Generate & Store Keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Password untuk Keystore (opsional, default: mySecurePassword123)'
        required: false
        default: 'mySecurePassword123'
        type: string
      key_password:
        description: 'Password untuk Key (opsional, default: mySecurePassword123)'
        required: false
        default: 'mySecurePassword123'
        type: string
      key_alias:
        description: 'Alias untuk Key (default: upload)'
        required: false
        default: 'upload'
        type: string

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        env:
          STORE_PASS: ${{ inputs.store_password || 'mySecurePassword123' }}
          KEY_PASS: ${{ inputs.key_password || 'mySecurePassword123' }}
          KEY_ALIAS: ${{ inputs.key_alias || 'upload' }}
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Gallery App,OU=Mobile,O=Personal,L=Jakarta,ST=DKI,C=ID"

      - name: Encode to Base64
        run: |
          base64 -w 0 my-upload-key.jks > keystore-base64.txt
          echo "================================================================"
          echo "COPY SELURUH ISI BASE64 DI BAWAH INI KE GITHUB SECRET: RELEASE_KEYSTORE_BASE64"
          echo "================================================================"
          cat keystore-base64.txt
          echo ""
          echo "================================================================"

      - name: Upload Keystore as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-file
          path: my-upload-key.jks
          retention-days: 30
