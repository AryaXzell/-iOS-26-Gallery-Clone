name: Build & Deploy APKs (Universal, 64-bit, 32-bit)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Multi-Architecture APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create local.properties & Mock Environment
        run: |
          touch .env
          echo "GOOGLE_SERVICES_EMPTY=true" > .env

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Determine Build Task
        id: build_task
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BUILD_TYPE="release"
          fi
          echo "type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "task=assembleRelease" >> $GITHUB_OUTPUT
          else
            echo "task=assembleDebug" >> $GITHUB_OUTPUT
          fi

      - name: Decode Keystore (For Release Build)
        if: steps.build_task.outputs.type == 'release' && secrets.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Build Split & Universal APKs with Gradle
        run: |
          BUILD_TASK="${{ steps.build_task.outputs.task }}"
          echo "Executing task: $BUILD_TASK with -PsplitApks"
          if [ -f "./gradlew" ]; then
            ./gradlew $BUILD_TASK -PsplitApks --stacktrace
          else
            gradle $BUILD_TASK -PsplitApks --stacktrace
          fi
        env:
          KEYSTORE_PATH: ${{ steps.build_task.outputs.type == 'release' && format('{0}/release.keystore', github.workspace) || '' }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect & Organize APK Artifacts
        id: organize_apks
        run: |
          mkdir -p output-apks/universal output-apks/arm64_64bit output-apks/arm_32bit output-apks/all
          
          echo "Searching for generated APKs..."
          find app/build/outputs/apk/ -name "*.apk" -type f
          
          BUILD_TYPE="${{ steps.build_task.outputs.type }}"
          
          # Copy Universal APK
          find app/build/outputs/apk/ -name "*universal*.apk" -exec cp {} output-apks/universal/Gallery-Universal-${BUILD_TYPE}.apk \;
          
          # Copy 64-bit APK (arm64-v8a)
          find app/build/outputs/apk/ -name "*arm64-v8a*.apk" -exec cp {} output-apks/arm64_64bit/Gallery-64bit-arm64-v8a-${BUILD_TYPE}.apk \;
          
          # Copy 32-bit APK (armeabi-v7a)
          find app/build/outputs/apk/ -name "*armeabi-v7a*.apk" -exec cp {} output-apks/arm_32bit/Gallery-32bit-armeabi-v7a-${BUILD_TYPE}.apk \;
          
          # Copy All APKs for bundle
          cp output-apks/universal/*.apk output-apks/all/ 2>/dev/null || true
          cp output-apks/arm64_64bit/*.apk output-apks/all/ 2>/dev/null || true
          cp output-apks/arm_32bit/*.apk output-apks/all/ 2>/dev/null || true
          
          # If split APKs were fallback named, copy standard APK as universal
          if [ ! -f output-apks/universal/Gallery-Universal-${BUILD_TYPE}.apk ]; then
            find app/build/outputs/apk/ -name "app-${BUILD_TYPE}.apk" -exec cp {} output-apks/universal/Gallery-Universal-${BUILD_TYPE}.apk \;
            find app/build/outputs/apk/ -name "app-${BUILD_TYPE}.apk" -exec cp {} output-apks/all/Gallery-Universal-${BUILD_TYPE}.apk \;
          fi
          
          echo "Organized APKs:"
          ls -laR output-apks/

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-Universal-APK
          path: output-apks/universal/*.apk
          retention-days: 14

      - name: Upload 64-bit ARM APK Artifact (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-64bit-arm64-APK
          path: output-apks/arm64_64bit/*.apk
          retention-days: 14

      - name: Upload 32-bit ARM APK Artifact (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-32bit-arm-APK
          path: output-apks/arm_32bit/*.apk
          retention-days: 14

      - name: Upload All Split APKs Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-All-Architectures-APKs
          path: output-apks/all/*.apk
          retention-days: 14

      - name: Create GitHub Release & Publish APKs (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/all/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
